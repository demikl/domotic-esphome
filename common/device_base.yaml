---
esphome:
  name: ${devicename}
  friendly_name: ${upper_devicename}

wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  #fast_connect: true

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${devicename} Hotspot
    password: "Entrap4-Polish-Catcall"


# si pas de connexion WiFi, créer un hotspot wifi
captive_portal:

# Enable logging
logger:
  level: INFO
  #level: INFO  ## minimum DEBUG obligatoire pour dumper les codes infrarouges recus, VERBOSE pour le multi-click
  #level: DEBUG
  #level: VERBOSE
  #level: VERY_VERBOSE

# API section specified on each device
# so that the encryption key can be specified individually for each device
#api:
# encryption:
#   key: !secret <devicename>__encryption_key

ota:
  - platform: esphome
    # password for OTA updates was used previously, now using encryption key
    #password: !secret ota_password
    encryption:
    # plaintext may be used the first time for OTA updates when encryption key is not yet set
    #  allow_plaintext_upload: true

switch:
  - platform: restart
    name: Reboot

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    update_interval: 600s
  - platform: uptime
    name: Uptime Sensor

text_sensor:
  - platform: wifi_info
    # ip_address:
    #   name: ESP IP Address
    ssid:
      name: ESP Connected SSID
    bssid:
      name: ESP Connected BSSID
    mac_address:
      name: ESP Mac Wifi Address
    scan_results:
      name: ESP Latest Scan Results
    dns_address:
      name: ESP DNS Address
